<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacity GR</title>
<meta name="description" content="Something new & exclusive is coming to Grand Rapids.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  background: #050505;
  color: #d4d0c8;
  font-family: 'Space Mono', monospace;
  overflow-x: hidden;
  overflow-y: auto;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Harsh scanlines */
.cap-scanlines {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 2px,
    rgba(0,0,0,0.15) 2px,
    rgba(0,0,0,0.15) 4px
  );
  pointer-events: none;
  z-index: 90;
}

/* Noise grain — jittery */
.cap-grain {
  position: fixed;
  top: -50%; left: -50%; right: -50%; bottom: -50%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.09'/%3E%3C/svg%3E");
  background-size: 256px;
  pointer-events: none;
  z-index: 95;
  animation: capGrainShift 0.3s steps(3) infinite;
}

@keyframes capGrainShift {
  0% { transform: translate(0, 0); }
  33% { transform: translate(-2px, 1px); }
  66% { transform: translate(1px, -2px); }
  100% { transform: translate(0, 0); }
}

/* Red ambient pulse */
.cap-glow {
  position: fixed;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,30,20,0.05) 0%, transparent 65%);
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%) translateY(-96px);
  animation: capPulse 4s ease-in-out infinite;
  pointer-events: none;
}

@keyframes capPulse {
  0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) translateY(-96px) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) translateY(-96px) scale(1.15); }
}

/* Jittery gray square */
.cap-screen {
  position: fixed;
  width: 360px;
  height: 360px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -35%);
  background: rgba(255,255,255,0.018);
  pointer-events: none;
  z-index: 0;
  animation: capScreenJitter 0.15s steps(2) infinite;
}

@keyframes capScreenJitter {
  0% { transform: translate(-50%, -35%); }
  25% { transform: translate(calc(-50% + 1px), calc(-35% - 1px)); }
  50% { transform: translate(calc(-50% - 1px), calc(-35% + 1px)); }
  75% { transform: translate(calc(-50% + 1px), calc(-35% + 1px)); }
  100% { transform: translate(-50%, -35%); }
}

/* Main content */
.cap-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  transform: translateY(-96px);
  margin-bottom: -96px;
  position: relative;
  z-index: 1;
}

/* Logo */
.cap-logo {
  height: 260px;
  width: auto;
  opacity: 0;
  margin-bottom: 2.5rem;
  filter: grayscale(0.2) contrast(1.1);
  animation: capFlicker 0.15s ease forwards 0.3s, capFadeIn 0.8s ease forwards 0.3s;
  position: relative;
  z-index: 2;
}

@media (max-width: 1024px) {
  .cap-logo { height: 160px; }
}
@media (max-width: 768px) {
  .cap-logo { height: 120px; }
}
@media (max-width: 480px) {
  .cap-logo { height: 90px; }
}

/* Logo glow wrap */
.cap-logo-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 3.5rem;
}

.cap-logo-wrap::before {
  content: '';
  position: absolute;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,30,20,0.08) 0%, rgba(200,30,20,0.03) 40%, transparent 70%);
  z-index: 0;
  animation: capLogoGlow 5s ease-in-out infinite;
}

@keyframes capLogoGlow {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.1); }
}

/* Headline */
.cap-headline {
  font-family: 'Anton', sans-serif;
  font-size: clamp(1.6rem, 5vw, 4rem);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  line-height: 1;
  text-align: center;
  color: #d4d0c8;
  position: relative;
}

.cap-headline .cap-word {
  display: inline-block;
  opacity: 0;
  transform: translateY(100%) skewX(-3deg);
  animation: capSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.cap-headline .cap-word:nth-child(1) { animation-delay: 0.5s; }
.cap-headline .cap-word:nth-child(2) { animation-delay: 0.65s; }
.cap-headline .cap-word:nth-child(3) { animation-delay: 0.8s; }

@keyframes capSlideUp {
  to { opacity: 1; transform: translateY(0) skewX(0deg); }
}

/* Glitch on headline */
.cap-headline::before,
.cap-headline::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  overflow: hidden;
  opacity: 0;
  font-family: 'Anton', sans-serif;
  font-size: clamp(1.6rem, 5vw, 4rem);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  line-height: 1;
  text-align: center;
  animation: capGlitchReveal 4s ease-in-out infinite;
}

.cap-headline::before {
  color: #c81e14;
  clip-path: inset(0 0 60% 0);
  transform: translateX(-3px);
  animation-delay: 2s;
}

.cap-headline::after {
  color: #1e90c8;
  clip-path: inset(60% 0 0 0);
  transform: translateX(3px);
  animation-delay: 2.05s;
}

@keyframes capGlitchReveal {
  0%, 92%, 100% { opacity: 0; }
  93% { opacity: 0.8; transform: translateX(-4px); }
  94% { opacity: 0; }
  95% { opacity: 0.6; transform: translateX(3px); }
  96% { opacity: 0; }
}

/* Subline */
.cap-subline {
  font-size: clamp(0.65rem, 1.5vw, 0.8rem);
  font-weight: 400;
  color: #444;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  margin-top: 2rem;
  text-align: center;
  opacity: 0;
  font-family: 'Space Mono', monospace;
  animation: capFadeIn 1.5s ease forwards 1.4s;
}

@keyframes capFadeIn {
  to { opacity: 1; }
}

@keyframes capFlicker {
  0% { opacity: 0; }
  20% { opacity: 0.7; }
  40% { opacity: 0.3; }
  60% { opacity: 0.8; }
  80% { opacity: 0.5; }
  100% { opacity: 1; }
}

/* Drifting text */
.cap-drift-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.cap-drift {
  position: absolute;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: #5b5b5b;
  opacity: 0;
  white-space: nowrap;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  animation: capDrift 20s linear infinite, capTextFlicker 3s steps(1) infinite;
}

.cap-drift:nth-child(1) {
  top: 5%;
  left: -15%;
  animation-delay: 0s, 0.7s;
  animation-duration: 25s, 2.8s;
}
.cap-drift:nth-child(2) {
  top: 18%;
  left: -20%;
  animation-delay: 5s, 1.3s;
  animation-duration: 32s, 3.4s;
}
.cap-drift:nth-child(3) {
  top: 70%;
  left: -12%;
  animation-delay: 9s, 0.2s;
  animation-duration: 28s, 4.1s;
}
.cap-drift:nth-child(4) {
  top: 42%;
  left: -10%;
  animation-delay: 14s, 2.1s;
  animation-duration: 22s, 2.3s;
}
.cap-drift:nth-child(5) {
  top: 92%;
  left: -18%;
  animation-delay: 3s, 0.9s;
  animation-duration: 30s, 3.7s;
}

@keyframes capTextFlicker {
  0%, 100% { filter: brightness(1); color: #5b5b5b; }
  7% { filter: brightness(2.5); color: #c81e14; }
  8% { filter: brightness(0.4); color: #5b5b5b; }
  9% { filter: brightness(1); color: #5b5b5b; }
  42% { filter: brightness(1); color: #5b5b5b; }
  43% { filter: brightness(0.2); color: #c81e14; }
  44% { filter: brightness(1.8); color: #ff3025; }
  45% { filter: brightness(1); color: #5b5b5b; }
  78% { filter: brightness(1); color: #5b5b5b; }
  79% { filter: brightness(2); color: #ff3025; }
  80% { filter: brightness(0.3); color: #c81e14; }
  81% { filter: brightness(1.6); color: #ff3025; }
  82% { filter: brightness(1); color: #5b5b5b; }
}

@keyframes capDrift {
  0% { transform: translateX(0); opacity: 0; }
  5% { opacity: 0.3; }
  50% { opacity: 0.3; }
  95% { opacity: 0; }
  100% { transform: translateX(130vw); opacity: 0; }
}

/* Divider — red line */
.cap-line {
  width: 0px;
  height: 2px;
  background: #c81e14;
  margin-top: 2.5rem;
  opacity: 0;
  animation: capGrowLine 0.8s ease forwards 1.6s;
}

@keyframes capGrowLine {
  to { opacity: 0.7; width: 50px; }
}

/* Signup form */
.cap-signup {
  position: relative;
  z-index: 1;
  padding: 2rem 2rem 5rem;
  transform: translateY(-96px);
  margin-bottom: -96px;
  text-align: center;
  opacity: 0;
  animation: capFadeIn 1s ease forwards 2s;
  border-top: 1px solid rgba(255,255,255,0.04);
}

.cap-signup .cap-signup-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #444;
  margin-bottom: 1rem;
  display: block;
}

.cap-signup .cap-form-row {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 0;
  max-width: 500px;
  margin: 0 auto;
}

.cap-signup input[type="email"],
.cap-signup input[type="text"] {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-right: none;
  color: #d4d0c8;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  padding: 0.75rem 1rem;
  outline: none;
  transition: border-color 0.3s, background 0.3s;
  flex: 1;
  min-width: 0;
}

.cap-signup input[type="email"]:focus,
.cap-signup input[type="text"]:focus {
  border-color: #c81e14;
  background: rgba(200,30,20,0.04);
}

.cap-signup input[type="email"]::placeholder,
.cap-signup input[type="text"]::placeholder {
  color: #3a3a3a;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.cap-signup input[type="submit"] {
  background: #c81e14;
  border: 1px solid #c81e14;
  color: #050505;
  font-family: 'Anton', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 0.75rem 1.5rem;
  cursor: pointer;
  transition: background 0.3s, color 0.3s;
  white-space: nowrap;
}

.cap-signup input[type="submit"]:hover {
  background: #ff3025;
  color: #050505;
}

.cap-signup .cap-name-row {
  display: flex;
  justify-content: center;
  gap: 0;
  max-width: 500px;
  margin: 0 auto 0.5rem;
}

.cap-signup .cap-name-row input {
  border-right: none;
  flex: 1;
}

.cap-signup .cap-name-row input:last-child {
  border-right: 1px solid rgba(255,255,255,0.08);
}

.cap-signup .cap-name-row input:last-child:focus {
  border-right-color: #c81e14;
}

.cap-signup .cap-form-responses {
  max-width: 500px;
  margin: 0.5rem auto 0;
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: #c81e14;
}

@media (max-width: 600px) {
  .cap-signup .cap-name-row {
    flex-direction: column;
    gap: 0;
  }
  .cap-signup .cap-name-row input {
    border-right: 1px solid rgba(255,255,255,0.08) !important;
    border-bottom: none;
  }
  .cap-signup .cap-name-row input:last-child {
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .cap-signup .cap-name-row input:focus {
    border-color: #c81e14 !important;
  }
  .cap-signup .cap-form-row {
    flex-direction: column;
  }
  .cap-signup input[type="email"] {
    border-right: 1px solid rgba(255,255,255,0.08) !important;
  }
  .cap-signup input[type="email"]:focus {
    border-color: #c81e14 !important;
  }
  .cap-signup input[type="submit"] {
    width: 100%;
  }
}

/* Audio toggle */
.cap-audio-toggle {
  position: fixed;
  top: 1.5rem;
  right: 1.5rem;
  z-index: 10000;
  width: 36px;
  height: 36px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(5,5,5,0.8);
  transition: border-color 0.3s;
  opacity: 0;
  animation: capFadeIn 1s ease forwards 2.5s;
}

.cap-audio-toggle:hover {
  border-color: #c81e14;
}

.cap-audio-toggle.cap-playing {
  border-color: #c81e14;
}

.cap-audio-icon {
  width: 16px;
  height: 16px;
  color: #5b5b5b;
  transition: color 0.3s;
}

.cap-audio-toggle:hover .cap-audio-icon,
.cap-audio-toggle.cap-playing .cap-audio-icon {
  color: #c81e14;
}

/* Footer — sticky to bottom */
.cap-footer {
  padding: 1.2rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #333;
  border-top: 1px solid rgba(255,255,255,0.04);
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  z-index: 10001;
  background: #050505;
  font-family: 'Space Mono', monospace;
  opacity: 0;
  animation: capFadeIn 1s ease forwards 2.2s;
}

.cap-footer a {
  color: #c81e14;
  text-decoration: none;
  transition: color 0.3s;
}

.cap-footer a:hover {
  color: #ff3025;
}

.cap-footer-right {
  display: flex;
  gap: 2rem;
}

@media (max-width: 600px) {
  .cap-footer {
    flex-direction: column-reverse;
    gap: 0.75rem;
    text-align: center;
    padding: 1rem 1.5rem;
  }
  .cap-footer-right {
    gap: 1.5rem;
  }
}
</style>
</head>
<body>

<div class="cap-scanlines"></div>
<div class="cap-grain"></div>
<div class="cap-glow"></div>
<div class="cap-screen"></div>

<div class="cap-drift-container">
  <span class="cap-drift">// no guest list — iykyk //</span>
  <span class="cap-drift">:: intimate dj sets ::</span>
  <span class="cap-drift">-- Luke Turbosound System --</span>
  <span class="cap-drift">[ limited capacity ]</span>
  <span class="cap-drift">/// presales only ///</span>
</div>

<main class="cap-main">
  <div class="cap-logo-wrap">
    <img class="cap-logo" src="https://cdn.convertri.com/408e1be2-f4de-11e9-99fe-0697e5ca793e%2F83ca4377521652570541222944d2d874b61f1365%2FCAPACITYGR%20no%20background.png" alt="Capacity GR">
  </div>
  <div class="cap-headline" data-text="SOMETHING NEW AWAITS">
    <span class="cap-word">Something&nbsp;</span>
    <span class="cap-word">New&nbsp;</span>
    <span class="cap-word">Awaits</span>
  </div>
  <p class="cap-subline">exclusive &mdash; coming soon</p>
  <div class="cap-line"></div>
</main>

<section class="cap-signup">
  <span class="cap-signup-label">// get on the list //</span>
  <form id="capSignupForm" onsubmit="return capSubmitForm(event)">
    <div class="cap-name-row">
      <input type="text" id="capFname" placeholder="First name" value="">
      <input type="text" id="capLname" placeholder="Last name" value="">
    </div>
    <div class="cap-form-row">
      <input type="email" id="capEmail" required placeholder="Email address" value="">
      <input type="submit" value="Submit">
    </div>
    <div class="cap-form-responses">
      <span id="capFormMsg"></span>
    </div>
  </form>
</section>

<footer class="cap-footer">
  <span>&copy; DrenFX Labs 2026 &mdash; All rights reserved</span>
  <div class="cap-footer-right">
    <a href="#" id="capContactLink">Contact</a>
  </div>
</footer>

<!-- Music toggle button -->
<div class="cap-audio-toggle" id="capAudioToggle" onclick="capToggleAudio()">
  <svg class="cap-audio-icon cap-audio-off" id="capAudioOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <line x1="23" y1="9" x2="17" y2="15"/>
    <line x1="17" y1="9" x2="23" y2="15"/>
  </svg>
  <svg class="cap-audio-icon cap-audio-on" id="capAudioOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none;">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
  </svg>
</div>

<!-- Hidden SoundCloud Player -->
<iframe id="capSCPlayer" style="position:absolute;width:0;height:0;border:0;overflow:hidden;" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fadegemusic%2Fgather-in-darkness&auto_play=true&buying=false&sharing=false&download=false&show_artwork=false&show_playcount=false&show_user=false&start_track=0&single_active=false"></iframe>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
var capSCWidget;
var capIsPlaying = false;

function capUpdateIcons(playing) {
  var iconOff = document.getElementById('capAudioOff');
  var iconOn = document.getElementById('capAudioOn');
  var btn = document.getElementById('capAudioToggle');
  if (playing) {
    iconOff.style.display = 'none';
    iconOn.style.display = 'block';
    btn.classList.add('cap-playing');
  } else {
    iconOff.style.display = 'block';
    iconOn.style.display = 'none';
    btn.classList.remove('cap-playing');
  }
  capIsPlaying = playing;
}

function capToggleAudio() {
  if (!capSCWidget) return;
  if (capIsPlaying) {
    capSCWidget.pause();
    capUpdateIcons(false);
  } else {
    capSCWidget.play();
    capUpdateIcons(true);
  }
}

function capInitSC() {
  var iframe = document.getElementById('capSCPlayer');
  capSCWidget = SC.Widget(iframe);
  capSCWidget.bind(SC.Widget.Events.READY, function() {
    capSCWidget.setVolume(50);
    capSCWidget.play();
    capUpdateIcons(true);

    capSCWidget.bind(SC.Widget.Events.FINISH, function() {
      capSCWidget.seekTo(0);
      capSCWidget.play();
    });

    capSCWidget.bind(SC.Widget.Events.PLAY, function() {
      capUpdateIcons(true);
    });

    capSCWidget.bind(SC.Widget.Events.PAUSE, function() {
      capUpdateIcons(false);
    });
  });

  function startOnInteraction() {
    if (!capIsPlaying && capSCWidget) {
      capSCWidget.play();
      capUpdateIcons(true);
    }
    document.removeEventListener('click', startOnInteraction);
    document.removeEventListener('touchstart', startOnInteraction);
  }
  document.addEventListener('click', startOnInteraction);
  document.addEventListener('touchstart', startOnInteraction);
}

if (document.readyState === 'complete') {
  capInitSC();
} else {
  window.addEventListener('load', capInitSC);
}

// Google Sheets form submission
function capSubmitForm(e) {
  e.preventDefault();
  var btn = document.querySelector('.cap-signup input[type="submit"]');
  var msg = document.getElementById('capFormMsg');
  var firstName = document.getElementById('capFname').value;
  var lastName = document.getElementById('capLname').value;
  var email = document.getElementById('capEmail').value;

  btn.value = '...';
  btn.disabled = true;
  msg.textContent = '';

  fetch('https://script.google.com/macros/s/AKfycbwXdez4jb5UfckHdVA1sVo0iKpHXVc1RZkdIGjQ55zHqm6RRfZ6oMx9MonZrvF6ooxCtA/exec', {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      firstName: firstName,
      lastName: lastName,
      email: email
    })
  }).then(function() {
    msg.style.color = '#c81e14';
    msg.textContent = 'YOU\'RE IN.';
    document.getElementById('capFname').value = '';
    document.getElementById('capLname').value = '';
    document.getElementById('capEmail').value = '';
    btn.value = 'Submit';
    btn.disabled = false;
  }).catch(function() {
    msg.style.color = '#c81e14';
    msg.textContent = 'SOMETHING WENT WRONG. TRY AGAIN.';
    btn.value = 'Submit';
    btn.disabled = false;
  });
